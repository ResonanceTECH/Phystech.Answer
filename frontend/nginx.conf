server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Загрузка документов администратором (до 64 МБ за запрос).
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # API проксируется на backend; LLM-ответы могут идти долго — щедрые таймауты
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # SPA: все остальные пути — на index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
