name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Selectel server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # первый запуск качает модели (~6 ГБ) — ждём дольше 10 мин по умолчанию
          command_timeout: 90m
          script: |
            set -e
            cd /home/deploy/phystech-answer
            git pull --ff-only
            docker compose up -d --build
