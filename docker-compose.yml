# Физтех.Ответ — весь стенд одной командой (работает и без .env):
#   docker compose up -d --build
# UI: http://localhost:3000 · API: http://localhost:8080 · ML: http://localhost:8000
# Письма (сброс пароля): http://localhost:8025
# Первый запуск 10–20 минут: скачиваются модели (~4 ГБ), сканы распознаются OCR.
# Готовность: curl localhost:8000/health → documents: 20.
name: phystech-answer

x-llama: &llama
  image: ghcr.io/ggml-org/llama.cpp:server
  volumes:
    - llama-cache:/root/.cache/llama.cpp
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fiztech_admin
      POSTGRES_DB: fiztech_answer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiztech_dev_hack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # для локальных утилит (psql, DBeaver, cmd/ingest); только localhost
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiztech_admin -d fiztech_answer"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ---------- Локальные модели (llama.cpp): данные не покидают контур ----------
  # Модели скачиваются при первом запуске в volume llama-cache.
  # На машине с GPU / Apple Silicon можно запустить llama-server на хосте и
  # указать LLM_BASE_URL / EMBED_BASE_URL / RERANK_BASE_URL в .env (см. ml/README).
  llm:
    <<: *llama
    command: ["-hf", "unsloth/Qwen3.5-4B-GGUF:Q4_K_M", "--alias", "local", "-c", "16384", "-np", "2",
              "--no-mmproj", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 30s

  embed:
    <<: *llama
    command: ["-hf", "Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0", "--alias", "local", "--embedding", "--pooling", "last",
              "-c", "8192", "-ub", "8192", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 30s

  rerank:
    <<: *llama
    command: ["-hf", "ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF", "--alias", "local", "--reranking",
              "-c", "8192", "-ub", "8192", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 30s

  ml:
    build: ./ml
    depends_on:
      llm: { condition: service_healthy }
      embed: { condition: service_healthy }
      rerank: { condition: service_healthy }
    environment:
      PORT: 8000
      CORS_ORIGIN: "*"
      INDEX_PATH: /data/index.json
      # "off" в любом *_BASE_URL — деградированный режим без компонента.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-local}
      LLM_DISABLE_THINKING: ${LLM_DISABLE_THINKING:-true}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://embed:8080/v1}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-local}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://rerank:8080/v1}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-local}
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.05}
    extra_hosts:
      # host.docker.internal на Linux (llama-server на хосте — опционально)
      - "host.docker.internal:host-gateway"
    volumes:
      - ml-data:/data
    ports:
      - "127.0.0.1:${ML_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 8080
      # Origin фронтенда (cookie-сессии не работают с '*').
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ML_SERVICE_URL: http://ml:8000
      ML_TIMEOUT_SECONDS: "300"
      DATABASE_URL: postgresql://fiztech_admin:${POSTGRES_PASSWORD:-fiztech_dev_hack}@postgres:5432/fiztech_answer
      STORAGE_PATH: /data/files
      # База знаний: импортируется при старте (повторы по SHA-256 пропускаются),
      # сканы распознаются OCR (poppler + Tesseract).
      DOCS_DIR: /docs
      # Синтетические демо-документы выключены: ответы только по документам кейса.
      # Демо-аккаунты, подразделения и назначения создаются всегда.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Auth / почта. Пустой SMTP_HOST отключает отправку писем.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-Физтех.Ответ <no-reply@phystech.answer>}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-72}
      REMEMBER_TTL_HOURS: ${REMEMBER_TTL_HOURS:-720}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-20}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-}
    volumes:
      - backend-data:/data
      - ./ml/data/documents:/docs:ro
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      ml: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Локальный SMTP-перехватчик для писем восстановления пароля.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Физтех.Ответ}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
        VITE_ENABLE_ADMIN: ${VITE_ENABLE_ADMIN:-true}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  llama-cache:
  ml-data:
  backend-data:
