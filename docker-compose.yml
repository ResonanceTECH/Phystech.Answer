# Физтех.Ответ — весь стенд одной командой (работает и без .env):
#   docker compose up -d --build
# UI: http://localhost:3000 · API: http://localhost:8080 · ML: http://localhost:8000
# Первый запуск 10–20 минут: скачиваются модели, сканы распознаются OCR.
# Готовность: curl localhost:8000/health → documents: 20, vectors == chunks.
name: phystech-answer

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fiztech_admin
      POSTGRES_DB: fiztech_answer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiztech_dev_hack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Только localhost: для DBeaver/psql (порт меняется DB_PORT).
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiztech_admin -d fiztech_answer"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Локальные модели: эмбеддинги bge-m3 и генерация Qwen 3.5 4B.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # Однократно скачивает модели в volume ollama и завершается.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${EMBED_MODEL:-bge-m3} && ollama pull ${LOCAL_LLM_MODEL:-qwen3.5:4b}"]
    volumes:
      - ollama:/root/.ollama
    restart: "no"

  # H2O-Lightning-4B — decision model (калиброванная вероятность «фрагмент
  # отвечает на вопрос»): реранкинг и решение «есть ли ответ в базе».
  decider:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -hf
      - h2oai/h2o-lightning-4b-gguf:${DECIDER_QUANT:-Q4_K_M}
      - --alias
      - h2oai/h2o-lightning-4b
      - -c
      - "16384"
      - -np
      - "4"
      - --no-mmproj
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - llama-cache:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 30s
    restart: unless-stopped

  ml:
    build: ./ml
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
    environment:
      PORT: "8000"
      CORS_ORIGIN: "*"
      INDEX_PATH: /data/index.json
      # Генерация: по умолчанию локальная модель в контейнере ollama.
      # Внешний OpenAI-совместимый API (только для открытых данных) — через
      # LLM_BASE_URL / LLM_API_KEY / LLM_MODEL в .env.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b}
      # none — отключить «размышления» гибридных моделей (Qwen 3.5): ответ по
      # найденным фрагментам их не требует, а задержка вырастает в разы.
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT-none}
      # Эмбеддинги всегда локально (документы не покидают контур).
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://ollama:11434/v1}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      RAG_MODE: ${RAG_MODE:-hybrid}
      # Реранкер: decision — H2O-Lightning-4B (сервис decider), llm — модель генерации, off
      RAG_RERANK: ${RAG_RERANK:-decision}
      DECISION_BASE_URL: ${DECISION_BASE_URL:-http://decider:8080}
      RAG_DECOMPOSE: ${RAG_DECOMPOSE:-true}
      RAG_AMENDMENTS: ${RAG_AMENDMENTS:-true}
      RAG_TOP_K: ${RAG_TOP_K:-6}
    extra_hosts:
      # host.docker.internal на Linux (Ollama/llama-server на хосте — опционально)
      - "host.docker.internal:host-gateway"
    volumes:
      - ml-data:/data
    ports:
      - "127.0.0.1:${ML_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: "8080"
      CORS_ORIGIN: "*"
      ML_SERVICE_URL: http://ml:8000
      ML_TIMEOUT_SECONDS: "300"
      DATABASE_URL: postgresql://fiztech_admin:${POSTGRES_PASSWORD:-fiztech_dev_hack}@postgres:5432/fiztech_answer
      STORAGE_PATH: /data/files
      # База знаний: импортируется при старте (повторы по SHA-256 пропускаются).
      DOCS_DIR: /docs
      # Синтетические демо-документы выключены: ответы только по документам кейса.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      - backend-data:/data
      - ./ml/data/documents:/docs:ro
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      ml: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Физтех.Ответ}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        VITE_ENABLE_ADMIN: ${VITE_ENABLE_ADMIN:-true}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
  llama-cache:
  ml-data:
  backend-data:
