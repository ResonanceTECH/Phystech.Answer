# Физтех.Ответ — весь стенд одной командой (работает и без .env):
#   docker compose up -d --build
# UI: http://localhost:3000 · API: http://localhost:8080 · ML: http://localhost:8000
# Письма (сброс пароля): http://localhost:8025
# Первый запуск 10–20 минут: скачиваются модели (~4 ГБ), сканы распознаются OCR.
# Готовность: curl localhost:8000/health → documents: 20.
name: phystech-answer

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fiztech_admin
      POSTGRES_DB: fiztech_answer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiztech_dev_hack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # для локальных утилит (psql, DBeaver, cmd/ingest); только localhost.
      # 5433 по умолчанию, т.к. 5432 на хосте может занимать системный PostgreSQL.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiztech_admin -d fiztech_answer"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Локальные модели генерации и эмбеддингов. На macOS для ускорения можно
  # использовать Ollama на хосте через LLM_BASE_URL / EMBED_BASE_URL в .env.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${EMBED_MODEL:-bge-m3} && ollama pull ${LOCAL_LLM_MODEL:-qwen3.5:4b}"]
    volumes:
      - ollama:/root/.ollama
    restart: "no"

  # Калиброванный H2O decision model: реранкинг и evidence gate.
  decider:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-hf", "h2oai/h2o-lightning-4b-gguf:${DECIDER_QUANT:-Q4_K_M}",
              "--alias", "h2oai/h2o-lightning-4b", "-c", "16384", "-np", "4",
              "--no-mmproj", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      # llama.cpp downloads Hugging Face models here; persist the 2+ GB model
      # so a container recreation does not fetch it again.
      - llama-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Первый запуск скачивает ~2.7 ГБ модели; ошибки health в этот период не считаются.
      start_period: 60m
    restart: unless-stopped

  ml:
    build: ./ml
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
      decider: { condition: service_healthy }
    environment:
      PORT: 8000
      CORS_ORIGIN: "*"
      INDEX_PATH: /data/index.json
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT-none}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://ollama:11434/v1}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      RAG_MODE: ${RAG_MODE:-hybrid}
      RAG_RERANK: ${RAG_RERANK:-decision}
      DECISION_BASE_URL: ${DECISION_BASE_URL:-http://decider:8080}
      RAG_DECOMPOSE: ${RAG_DECOMPOSE:-true}
      RAG_AMENDMENTS: ${RAG_AMENDMENTS:-true}
      RAG_TOP_K: ${RAG_TOP_K:-6}
      RAG_MIN_VECTOR: ${RAG_MIN_VECTOR:-0.47}
      RAG_MIN_BM25: ${RAG_MIN_BM25:-10}
    extra_hosts:
      # host.docker.internal на Linux (llama-server на хосте — опционально)
      - "host.docker.internal:host-gateway"
    volumes:
      - ml-data:/data
    ports:
      - "127.0.0.1:${ML_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 8080
      # Origin фронтенда (cookie-сессии не работают с '*').
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ML_SERVICE_URL: http://ml:8000
      # Генерация на 4B-модели может идти минуты; держим ниже WriteTimeout ml (360s).
      ML_TIMEOUT_SECONDS: ${ML_TIMEOUT_SECONDS:-300}
      DATABASE_URL: postgresql://fiztech_admin:${POSTGRES_PASSWORD:-fiztech_dev_hack}@postgres:5432/fiztech_answer
      STORAGE_PATH: /data/files
      # База знаний: импортируется при старте (повторы по SHA-256 пропускаются),
      # сканы распознаются OCR (poppler + Tesseract).
      DOCS_DIR: /docs
      # Синтетические демо-документы выключены: ответы только по документам кейса.
      # Демо-аккаунты, подразделения и назначения создаются всегда.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Auth / почта. Пустой SMTP_HOST отключает отправку писем.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-Физтех.Ответ <no-reply@phystech.answer>}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-72}
      REMEMBER_TTL_HOURS: ${REMEMBER_TTL_HOURS:-720}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-20}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-}
    volumes:
      - backend-data:/data
      - ./ml/data/documents:/docs:ro
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      ml: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Локальный SMTP-перехватчик для писем восстановления пароля.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Физтех.Ответ}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
        VITE_ENABLE_ADMIN: ${VITE_ENABLE_ADMIN:-true}
    ports:
      # APP_PORT (или FRONTEND_PORT) позволяет опубликовать фронт на 80 при деплое.
      - "${APP_PORT:-${FRONTEND_PORT:-3000}}:80"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
  llama-cache:
  ml-data:
  backend-data:
