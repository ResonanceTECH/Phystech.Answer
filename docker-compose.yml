name: phystech-answer

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fiztech_admin
      POSTGRES_DB: fiztech_answer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiztech_dev_hack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiztech_admin -d fiztech_answer"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  ml:
    build: ./ml
    environment:
      PORT: 8000
      CORS_ORIGIN: "*"
      INDEX_PATH: /data/index.json
      # Ollama на хост-машине; "off" — деградированный режим без LLM
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.25}
    extra_hosts:
      # чтобы host.docker.internal работал и на Linux (на macOS/Windows он есть из коробки)
      - "host.docker.internal:host-gateway"
    volumes:
      - ml-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 8080
      CORS_ORIGIN: "*"
      ML_SERVICE_URL: http://ml:8000
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DATABASE_URL: postgresql://fiztech_admin:${POSTGRES_PASSWORD:-fiztech_dev_hack}@postgres:5432/fiztech_answer
      STORAGE_PATH: /data/files
    volumes:
      - backend-data:/data
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Физтех.Ответ}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
        VITE_ENABLE_ADMIN: ${VITE_ENABLE_ADMIN:-true}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  ml-data:
  backend-data:
